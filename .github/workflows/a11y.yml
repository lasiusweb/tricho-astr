name: Accessibility checks (Lighthouse & axe)

on:
  pull_request:
    types: [opened, synchronize, reopened]

jobs:
  a11y:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies
        run: npm ci

      - name: Build site
        run: npm run build

      - name: Start static server
        # Use npx to avoid adding a dev dependency; run in background
        run: npx http-server ./dist -p 8080 --silent &

      - name: Wait for server
        run: npx wait-on http://127.0.0.1:8080 -t 60000

      - name: Run Lighthouse (accessibility)
        id: lighthouse
        run: |
          npx lighthouse http://127.0.0.1:8080 \
            --chrome-flags="--no-sandbox --headless=new" \
            --only-categories=accessibility \
            --output=json --output-path=./lighthouse.json
          score=$(jq '.categories.accessibility.score' lighthouse.json)
          echo "score=$score" >> $GITHUB_OUTPUT

      - name: Run axe-core CLI
        run: npx @axe-core/cli http://127.0.0.1:8080 --save=axe.json

      - name: Run pa11y (accessibility checks)
        # Use pa11y to produce a machine-readable JSON report
        run: |
          # Install pa11y via npx and run JSON reporter; allow non-zero exit so the script can parse output
          npx pa11y http://127.0.0.1:8080 --reporter json > pa11y.json || true

      - name: Fail on high-severity pa11y issues
        # Count pa11y entries with type 'error' and fail if any found
        run: |
          if [ -f pa11y.json ]; then
            errors=$(jq '[.[] | select(.type=="error" or .type=="Error" or .type=="ERROR")] | length' pa11y.json) || errors=0
          else
            echo "pa11y.json not found, skipping error check"; errors=0
          fi
          echo "pa11y high-severity issues: $errors"
          if [ "$errors" -gt 0 ]; then
            echo "Failing job due to pa11y high-severity issues"; exit 1
          fi

      - name: Upload accessibility reports
        uses: actions/upload-artifact@v4
        with:
          name: a11y-reports
          path: |
            lighthouse.json
            axe.json
            pa11y.json

      - name: Fail if Lighthouse accessibility < 90%
        run: |
          echo "Lighthouse accessibility score: ${{ steps.lighthouse.outputs.score }}"
          awk -v s="${{ steps.lighthouse.outputs.score }}" 'BEGIN { if (s < 0.9) { print "ACCESSIBILITY SCORE TOO LOW: " s; exit 1 } else { print "Accessibility score OK: " s; exit 0 } }'

      - name: Comment PR with scores
        uses: actions/github-script@v6
        env:
          LH_SCORE: ${{ steps.lighthouse.outputs.score }}
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const score = process.env.LH_SCORE || 'unknown';
            const pr = context.payload.pull_request && context.payload.pull_request.number;
            const pct = (score === 'unknown') ? 'unknown' : Math.round(Number(score) * 100) + '%';
            if (pr) {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: pr,
                body: `Automated accessibility check:\n- Lighthouse accessibility: ${pct} (raw: ${score})\n- axe report: attached as artifact\n\nIf the Lighthouse score is below 90%, this job fails. Please address failures before merging.`
              });
            }

      - name: Log summary
        run: |
          if [ -f lighthouse.json ]; then jq '.categories.accessibility.score' lighthouse.json || true; fi
          if [ -f axe.json ]; then echo "axe.json size:" $(wc -c < axe.json) || true; fi
